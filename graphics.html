  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img class="brand-avatar" src="pass.png" alt="Mohamed Salum" />

      <div class="nav-actions">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="siteNav">☰</button>

          <a href="index.html#about">About</a>

      <div class="section-head">
        <h2>Graphics Design</h2>
        <p class="muted">Selected visual design projects including branding, posters, ads, and social media graphics.</p>

        <div class="modal-meta">
          <h3 id="modalTitle"></h3>
          <p id="modalDesc" class="muted"></p>
